name: Paper safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.13.3
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/trading_agent
      - run: uv run pytest --cov=trading_agent --cov-report=term-missing --cov-report=xml
      - run: node --test tests/ui/console.test.cjs
      - run: uv run python scripts/check_secrets.py
      - run: uv run pip-audit --skip-editable
      - run: uv run python scripts/benchmark.py --samples 1000
      - run: uv run python scripts/benchmark_strategy.py --samples 1000
      - run: uv run trading-agent ml-demo --directory data/ci-ml
      - run: uv run python scripts/benchmark_ml.py --model data/ci-ml/model --allow-synthetic-model --samples 1000
      - run: uv run trading-agent paper-demo --directory data/ci-paper
      - run: uv run python scripts/benchmark_paper.py --samples 1000
      - run: uv run trading-agent long-term-demo --directory data/ci-long-term
      - run: uv run python scripts/benchmark_long_term.py --samples 1000
